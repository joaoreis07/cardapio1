<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabor da Casa | Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">
  <header class="topbar admin-topbar">
    <div>
      <p class="eyebrow">Painel admin</p>
      <h1>Sabor da Casa</h1>
      <p>Cadastre produtos, imagens e o WhatsApp do negócio.</p>
    </div>
    <a class="admin-link" href="index.html">Ver cardápio</a>
  </header>

  <main class="admin-shell">
    <section class="admin-grid">
      <form class="admin-card" id="productForm">
        <div class="section-title">
          <p class="eyebrow">Produtos</p>
          <h2 id="formTitle">Cadastrar produto</h2>
        </div>

        <input type="hidden" id="productId">

        <label>
          Nome
          <input id="productName" type="text" placeholder="Ex: X-Bacon" required>
        </label>

        <label>
          Preço
          <input id="productPrice" type="number" min="0" step="0.01" placeholder="16.00" required>
        </label>

        <label>
          Descrição
          <textarea id="productDescription" rows="3" placeholder="Ingredientes principais" required></textarea>
        </label>

        <label>
          Categoria
          <input id="productCategory" type="text" placeholder="Lanches" required>
        </label>

        <label>
          Ingredientes removíveis
          <textarea id="productRemovals" rows="4" placeholder="Uma opção por linha. Ex:&#10;sem cebola&#10;sem tomate&#10;sem alface"></textarea>
        </label>

        <label>
          Adicionais
          <textarea id="productAddons" rows="6" placeholder="Uma opção por linha: Grupo; Nome; Preço&#10;Ex:&#10;Queijos; Mussarela; 2&#10;Proteínas; Bacon; 4&#10;Molhos; Molho especial; 2"></textarea>
        </label>

        <label>
          Imagem do produto
          <input id="productImage" type="file" accept="image/*">
        </label>

        <img class="admin-preview" id="imagePreview" alt="Prévia da imagem do produto">

        <div class="button-row">
          <button class="primary-button" type="submit">Salvar produto</button>
          <button class="ghost-button" id="cancelEdit" type="button">Cancelar</button>
        </div>
      </form>

      <section class="admin-card">
        <div class="section-title">
          <p class="eyebrow">WhatsApp</p>
          <h2>Configuração</h2>
        </div>
        <label>
          Número com DDI e DDD
          <input id="phoneInput" type="tel" placeholder="5511999999999">
        </label>
        <button class="primary-button whatsapp-button" id="savePhone" type="button">Salvar WhatsApp</button>
        <p class="current-phone">Número atual: <strong id="currentPhone">Não configurado</strong></p>
      </section>
    </section>

    <section class="admin-card product-list-card">
      <div class="section-title">
        <p class="eyebrow">Catálogo</p>
        <h2>Produtos cadastrados</h2>
      </div>
      <div id="adminProducts" class="admin-products"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
